<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>UNT Grammar Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: sticky progress bar over a two-column exam sheet (question map left, paper right); one column on phones. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --surface-2: #f4f6fb;
  --ink: #0f1a2e;
  --muted: #58657c;
  --line: #d6dce7;
  --accent: #2447d6;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9ff;
  --good: #0e7a55;
  --good-soft: #dcf3e9;
  --bad: #b8322f;
  --bad-soft: #fbe4e3;
  --warn: #8a5a00;
  --warn-soft: #fff0d1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --surface: #141c30; --surface-2: #1a2440; --ink: #e7ecf7; --muted: #98a5bf; --line: #2a3555;
    --accent: #8ca6ff; --accent-ink: #0c1220; --accent-soft: #222f5c;
    --good: #4fd3a0; --good-soft: #123a2d; --bad: #ff8a86; --bad-soft: #4a1e1f; --warn: #f2c26b; --warn-soft: #44340f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --surface: #141c30; --surface-2: #1a2440; --ink: #e7ecf7; --muted: #98a5bf; --line: #2a3555;
  --accent: #8ca6ff; --accent-ink: #0c1220; --accent-soft: #222f5c;
  --good: #4fd3a0; --good-soft: #123a2d; --bad: #ff8a86; --bad-soft: #4a1e1f; --warn: #f2c26b; --warn-soft: #44340f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1120px; margin: 0 auto; }

/* intro */
.intro { padding-block: 32px 20px; display: grid; gap: 16px; }
.kicker { font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 48px); line-height: 1.05; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 10px; }
.tab { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.tab small { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tab strong { font-family: var(--font-display); font-size: 18px; font-weight: 650; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tab[aria-selected="true"] small { color: var(--accent); }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .inner { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.meter { flex: 1 1 160px; min-width: 0; height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.stat { font-family: var(--font-mono); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { color: var(--muted); font-weight: 500; }

/* layout */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; align-items: start; padding-block: 24px 140px; }
.map { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
.map h2 { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.dot { aspect-ratio: 1; min-width: 0; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 0; font-variant-numeric: tabular-nums; }
.dot.answered { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.dot.part { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.dot.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.legend { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.legend b { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; }

.paper { display: grid; gap: 28px; min-width: 0; }
.part { display: grid; gap: 14px; min-width: 0; }
.part-head { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.part-head .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.part-head h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.part-head p { margin: 0; font-style: italic; color: var(--muted); font-size: 16px; max-width: 70ch; }
.passage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin: 0; max-width: 72ch; text-align: left; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin: 0; min-width: 0; display: grid; gap: 12px; scroll-margin-top: 80px; }
.q legend { padding: 0; width: 100%; float: left; }
.q legend + * { clear: both; }
.qhead { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.qtitle { display: flex; gap: 12px; align-items: baseline; min-width: 0; }
.qn { font-family: var(--font-mono); font-weight: 600; font-size: 15px; color: var(--accent); min-width: 2ch; }
.qtext { font-weight: 600; font-size: 19px; }
.stem { margin: 0; padding: 10px 14px; background: var(--surface-2); border-radius: 10px; font-size: 18px; }
.blank { display: inline-block; width: 7ch; border-bottom: 2px solid var(--ink); vertical-align: baseline; margin: 0 2px; }
.verdict { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.part { background: var(--warn-soft); color: var(--warn); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }

.opts { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; display: flex; gap: 12px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; min-width: 0; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.key { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 14px; background: var(--surface-2); }
.checks .key { border-radius: 50%; }
.txt { min-width: 0; overflow-wrap: anywhere; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .tag { margin-left: auto; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.is-done .opt { cursor: default; }
.is-done .opt:hover { border-color: var(--line); }
.is-done .opt.is-right { border-color: var(--good); background: var(--good-soft); }
.is-done .opt.is-right .key { background: var(--good); border-color: var(--good); color: var(--bg); }
.is-done .opt.is-right .tag { color: var(--good); }
.is-done .opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.is-done .opt.is-wrong .key { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.is-done .opt.is-wrong .tag { color: var(--bad); }

/* matching */
.mrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 4px; }
.mlabel { flex: 1 1 220px; min-width: 0; font-weight: 600; }
.mlabel .qn { margin-right: 8px; }
.pick { display: flex; gap: 6px; }
.pick label { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.pick span { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-family: var(--font-mono); font-weight: 600; }
.pick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.is-done .pick input { cursor: default; }
.is-done .pick .is-right span { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.is-done .pick .is-wrong span { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.mopts { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mopts li { display: flex; gap: 10px; align-items: baseline; min-width: 0; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; }
.mopts b { font-family: var(--font-mono); color: var(--accent); }

/* results */
.result { background: var(--surface); border: 2px solid var(--ink); border-radius: 20px; padding: 22px; display: grid; gap: 18px; scroll-margin-top: 80px; }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score strong { font-family: var(--font-display); font-size: clamp(48px, 9vw, 72px); font-weight: 750; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: 20px; }
.breakdown { display: grid; gap: 10px; }
.brow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr auto; gap: 12px; align-items: center; font-size: 16px; }
.brow .meter { height: 10px; }
.brow .meter i { background: var(--good); width: 0; }
.brow output { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }

/* submit bar */
.submit { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.submit .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.submit p { margin: 0; font-size: 16px; color: var(--muted); }
.submit p.warn { color: var(--warn); font-weight: 600; }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 650; font-size: 18px; padding: 12px 26px; }
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .map { position: static; }
  .grid { grid-template-columns: repeat(10, 1fr); }
  .dot { font-size: 11px; border-radius: 6px; }
}
@media (max-width: 560px) {
  body { font-size: 17px; }
  .opts, .mopts { grid-template-columns: minmax(0, 1fr); }
  .brow { grid-template-columns: 1fr auto; }
  .brow .meter { grid-column: 1 / -1; order: 3; }
  .q { padding: 16px 14px; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

      text: "Have you ever met a word that you did not know? Often you can guess its meaning if you look at its parts. English builds new words by adding small pieces to a base word. A piece added at the beginning is a prefix, and a piece added at the end is a suffix. For example, the prefix un- changes the word happy into unhappy, and the suffix -ness turns it into a noun: unhappiness. Prefixes usually change the meaning of a word, while suffixes often change its type. Add -ful to the word care, and you get an adjective: careful. Add -less, and the meaning becomes the opposite: careless. Some prefixes need special attention in spelling. Before the letters m and p we use im-, as in impossible, and before the letter r we use ir-, as in irregular. Learning about prefixes and suffixes helps students in two ways. First, they can understand new words faster when they read. Second, they can build their own vocabulary, because one base word can give them five or six new words. Teachers often advise learners to keep a small notebook where they write a base word and all the words made from it.",

        ["The correct form of the verb", "This pair of scissors ____________ dull.", ["are","is","were","have been"], "B"],
        ["The correct form of the verb", "There ____________ a storm approaching.", ["are","were","have been","is"], "D"],
        ["The correct form of the verb", "There ____________ too many people at the party.", ["was","is","were","has been"], "C"],
        ["The correct form of the verb", "Every elementary school teacher ____________ to take this examination.", ["have","has","are","were"], "B"]
      ],
      text: "Many students think that everybody means more than one person, so they use a plural verb after it. This is a common mistake. Words such as everyone, nobody and something always take a singular verb. Collective nouns, for example team, family and jury, are usually singular too, because they describe one group. However, some nouns are always plural. Scissors, jeans and pants have two parts, so we say, “The scissors are dull.” If we want a singular verb, we must say “a pair of scissors”. Another difficult area is the use of neither and either with nor and or. In these sentences, the verb agrees with the noun that stands closest to it. The best way to avoid mistakes is to find the real subject of the sentence before choosing the verb. Teachers advise learners to practise with short exercises every day.",
      reading: [
        ["What is the writer’s main aim in writing the text?", ["to say that plural verbs are never used in English","to explain that finding the real subject helps to choose the correct verb","to show that collective nouns are always plural","to suggest that teachers should avoid exercises"], "B"],
        ["According to the text, which verb follows “everybody”?", ["a plural verb","a past verb","a singular verb","no verb"], "C"],
        ["Why are collective nouns usually singular?", ["They have two parts","They describe one group","They end in -s","They are names of animals"], "B"],
        ["What must we say to use a singular verb with “scissors”?", ["a pair of scissors","the scissors","many scissors","some scissors"], "A"],
        ["In sentences with “neither … nor”, the verb agrees with ______.", ["the first noun","the noun closest to it","the longest noun","the last word of the sentence"], "B"]
      ],
      multi: [
        ["Word(s) that always take a singular verb", ["everybody","nothing","pliers","scissors","someone","jeans"], "A, B, E"],
        ["Collective noun(s) that are usually singular", ["family","committee","pants","crowd","tweezers","glasses"], "A, B, D"],
        ["Correct sentence(s)", ["Everyone has arrived.","Nobody are late.","Something was under the house.","The pants is in the drawer.","Each student have answered.","Dieting is popular."], "A, C, F"],
        ["Sentence(s) with the correct plural verb", ["Neither John nor his friends are going.","A number of students is going.","The scissors are dull.","None of the students have finished the exam.","There was too many people.","The number of days are seven."], "A, C, D"],
        ["Correct sentence(s) about amounts of time, money and distance", ["Twenty dollars is all I can afford.","Two miles are too much to run.","Fifty minutes isn’t enough time.","Twenty-five dollars are too much.","Two miles is too much to run in one day.","Fifty minutes aren’t enough time."], "A, C, E"]
      ],
      match: [
        ["Match the rules with the examples.", ["Gerund as a subject","Collective noun"], ["Writing many letters makes her happy.","The scissors are dull.","The family was elated by the news.","There were too many people."], "A,C"],
        ["Match the sentences with the missing verbs.", ["Neither the boys nor Carmen ____________ seen this movie before.","Neither Maria nor her friends ____________ going to class today."], ["has","are","is","have"], "A,B"],
        ["Match the expressions with their meanings.", ["A number of","The number of"], ["the total figure","many","a few days","never"], "B,A"],
        ["Match the beginnings with the correct endings.", ["There was","There were"], ["an accident last night.","too many people at the party.","a telephone calls.","many accident."], "A,B"],
        ["Match the groups of animals with the animals.", ["A pride of","A school of"], ["lions","fish","dogs","cattle"], "A,B"]
      ]
    }
  ];

  var PARTS = [
    { label: "Part 1", title: "One correct answer", info: "You are offered the test items with one correct answer from four proposed ones.", note: "Items 1–25 · 1 point each" },
    { label: "Part 2", title: "Reading", info: "You are offered the test items on the base of text with one correct answer from four proposed ones. Read the text attentively and do the items.", note: "Items 26–30 · 1 point each" },
    { label: "Part 3", title: "One or more correct answers", info: "You are offered the test tasks with one or more correct answers from multiple choices. In the test tasks with one or more correct answers there can be up to three correct answers.", note: "Items 31–35 · 2 points; 1 point with one mistake" },
    { label: "Part 4", title: "Matching", info: "You are offered the questions and answers which should be matched. In these tasks there are two correct answers.", note: "Items 36–40 · 1 point per correct match" }
  ];
  var MAXES = [25, 5, 10, 10];

  var KEY = "unt-grammar-practice-v1";
  var cur = 0, S = {}, timerId = null, confirming = false;

  function fresh() {
    return { s: Array(25).fill(null), r: Array(5).fill(null),
      m: [[], [], [], [], []], x: [[null, null], [null, null], [null, null], [null, null], [null, null]],
      done: false, secs: 0 };
  }
  function load() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { saved = null; }
    TESTS.forEach(function (t) {
      var st = saved && saved.tests && saved.tests[t.id];
      S[t.id] = (st && st.s && st.s.length === 25 && st.x && st.x.length === 5) ? st : fresh();
    });
    if (saved && typeof saved.cur === "number" && TESTS[saved.cur]) cur = saved.cur;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ cur: cur, tests: S })); } catch (e) { /* storage unavailable */ }
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/_{3,}/g, '<span class="blank" role="img" aria-label="blank"></span>'); }
  var A = "ABCDEF";

  /* ---------- scoring ---------- */
  function itemInfo(t, st, k) {
    // k: 0..39 global index; returns {pts, max, answered}
    if (k < 25) { var a = L(t.single[k][3]); return { pts: st.s[k] === a ? 1 : 0, max: 1, answered: st.s[k] !== null }; }
    if (k < 30) { var i = k - 25; var ar = L(t.reading[i][2]); return { pts: st.r[i] === ar ? 1 : 0, max: 1, answered: st.r[i] !== null }; }
    if (k < 35) {
      var j = k - 30, corr = Ls(t.multi[j][2]), sel = st.m[j];
      var wrong = sel.filter(function (v) { return corr.indexOf(v) < 0; }).length;
      var miss = corr.filter(function (v) { return sel.indexOf(v) < 0; }).length;
      var pts = (wrong + miss === 0) ? 2 : (wrong + miss === 1 ? 1 : 0);
      return { pts: pts, max: 2, answered: sel.length > 0 };
    }
    var m = k - 35, key = Ls(t.match[m][3]), pk = st.x[m], p = 0;
    if (pk[0] === key[0]) p++;
    if (pk[1] === key[1]) p++;
    return { pts: p, max: 2, answered: pk[0] !== null && pk[1] !== null };
  }
  function totals(t, st) {
    var parts = [0, 0, 0, 0], answered = 0;
    for (var k = 0; k < 40; k++) {
      var r = itemInfo(t, st, k);
      parts[k < 25 ? 0 : k < 30 ? 1 : k < 35 ? 2 : 3] += r.pts;
      if (r.answered) answered++;
    }
    return { parts: parts, sum: parts[0] + parts[1] + parts[2] + parts[3], answered: answered };
  }

  /* ---------- rendering ---------- */
  function verdict(t, st, k) {
    if (!st.done) return "";
    var r = itemInfo(t, st, k);
    if (r.pts === r.max) return '<span class="verdict ok">Correct · ' + r.pts + '/' + r.max + '</span>';
    if (r.pts > 0) return '<span class="verdict part">Partly · ' + r.pts + '/' + r.max + '</span>';
    return '<span class="verdict no">' + (r.answered ? "Incorrect" : "Skipped") + ' · 0/' + r.max + '</span>';
  }
  function qhead(t, st, k, text) {
    return '<div class="qhead"><div class="qtitle"><span class="qn">' + (k + 1) + '</span><span class="qtext">' + fmt(text) + '</span></div>' + verdict(t, st, k) + '</div>';
  }
  function radioQ(t, st, k, text, stem, opts, group, selIdx, correctIdx) {
    var h = '<fieldset class="q' + (st.done ? " is-done" : "") + '" id="q-' + (k + 1) + '"><legend class="sr" style="position:absolute;left:-9999px">Question ' + (k + 1) + '</legend>' + qhead(t, st, k, text);
    if (stem) h += '<p class="stem">' + fmt(stem) + '</p>';
    h += '<div class="opts">';
    opts.forEach(function (o, i) {
      var cls = "opt";
      var tag = "";
      if (st.done) {
        if (i === correctIdx) { cls += " is-right"; tag = '<span class="tag">Correct answer</span>'; }
        else if (i === selIdx) { cls += " is-wrong"; tag = '<span class="tag">Your answer</span>'; }
      }
      h += '<label class="' + cls + '"><input type="radio" name="' + group + '" value="' + i + '"' + (selIdx === i ? " checked" : "") + (st.done ? " disabled" : "") + '><span class="key">' + A[i] + '</span><span class="txt">' + esc(o) + '</span>' + tag + '</label>';
    });
    return h + '</div></fieldset>';
  }
  function multiQ(t, st, k, j) {
    var it = t.multi[j], corr = Ls(it[2]), sel = st.m[j];
    var h = '<fieldset class="q checks' + (st.done ? " is-done" : "") + '" id="q-' + (k + 1) + '"><legend style="position:absolute;left:-9999px">Question ' + (k + 1) + '</legend>' + qhead(t, st, k, it[0]) + '<div class="opts">';
    it[1].forEach(function (o, i) {
      var cls = "opt", tag = "";
      var isSel = sel.indexOf(i) >= 0, isCorr = corr.indexOf(i) >= 0;
      if (st.done) {
        if (isCorr) { cls += " is-right"; tag = '<span class="tag">' + (isSel ? "Correct" : "Missed") + '</span>'; }
        else if (isSel) { cls += " is-wrong"; tag = '<span class="tag">Wrong</span>'; }
      }
      h += '<label class="' + cls + '"><input type="checkbox" name="m-' + j + '" value="' + i + '"' + (isSel ? " checked" : "") + (st.done ? " disabled" : "") + '><span class="key">' + A[i] + '</span><span class="txt">' + esc(o) + '</span>' + tag + '</label>';
    });
    return h + '</div></fieldset>';
  }
  function matchQ(t, st, k, m) {
    var it = t.match[m], key = Ls(it[3]);
    var h = '<fieldset class="q' + (st.done ? " is-done" : "") + '" id="q-' + (k + 1) + '"><legend style="position:absolute;left:-9999px">Question ' + (k + 1) + '</legend>' + qhead(t, st, k, it[0]);
    h += '<ul class="mopts">';
    it[2].forEach(function (o, i) { h += '<li><b>' + A[i] + '</b><span>' + esc(o) + '</span></li>'; });
    h += '</ul>';
    it[1].forEach(function (lft, side) {
      var chosen = st.x[m][side];
      h += '<div class="mrow"><div class="mlabel"><span class="qn">' + (side + 1) + '.</span>' + fmt(lft) + '</div><div class="pick" role="radiogroup" aria-label="Answer for item ' + (side + 1) + '">';
      for (var i = 0; i < 4; i++) {
        var cls = "";
        if (st.done) { if (i === key[side]) cls = "is-right"; else if (i === chosen) cls = "is-wrong"; }
        h += '<label class="' + cls + '"><input type="radio" name="x-' + m + '-' + side + '" value="' + i + '"' + (chosen === i ? " checked" : "") + (st.done ? " disabled" : "") + '><span>' + A[i] + '</span></label>';
      }
      h += '</div></div>';
    });
    return h + '</fieldset>';
  }

  function partHead(p) {
    return '<div class="part-head"><span class="label">' + p.label + ' · ' + p.note + '</span><h2>' + p.title + '</h2><p><b>Instruction:</b> ' + esc(p.info) + '</p></div>';
  }

  function resultHtml(t, st) {
    var tt = totals(t, st), pct = Math.round(tt.sum / 50 * 100);
    var h = '<section class="result" id="result" tabindex="-1"><div class="kicker">Variant ' + t.variant + ' · ' + esc(t.name) + '</div>';
    h += '<div class="score"><strong>' + tt.sum + '</strong><span>of 50 points · ' + pct + '%</span><span>Time ' + clock(st.secs) + '</span></div><div class="breakdown">';
    PARTS.forEach(function (p, i) {
      var w = Math.round(tt.parts[i] / MAXES[i] * 100);
      h += '<div class="brow"><span>' + p.label + ' · ' + p.title + '</span><div class="meter"><i style="width:' + w + '%"></i></div><output>' + tt.parts[i] + '/' + MAXES[i] + '</output></div>';
    });
    h += '</div><p style="margin:0;color:var(--muted)">Scroll down to see every question with the correct answer marked. Green is correct, red is your wrong answer, amber is partly correct.</p></section>';
    return h;
  }

  function renderTabs() {
    document.getElementById("tabs").innerHTML = TESTS.map(function (t, i) {
      return '<button class="tab" role="tab" type="button" data-tab="' + i + '" aria-selected="' + (i === cur) + '"><small>Variant ' + t.variant + '</small><strong>' + esc(t.name) + '</strong></button>';
    }).join("");
  }

  function render() {
    var t = TESTS[cur], st = S[t.id], k = 0, h = "";
    if (st.done) h += resultHtml(t, st);
    h += '<section class="part">' + partHead(PARTS[0]);
    t.single.forEach(function (q, i) { h += radioQ(t, st, k, q[0], q[1], q[2], "s-" + i, st.s[i], L(q[3])); k++; });
    h += '</section><section class="part">' + partHead(PARTS[1]) + '<p class="passage">' + esc(t.text) + '</p>';
    t.reading.forEach(function (q, i) { h += radioQ(t, st, k, q[0], "", q[1], "r-" + i, st.r[i], L(q[2])); k++; });
    h += '</section><section class="part">' + partHead(PARTS[2]);
    t.multi.forEach(function (q, j) { h += multiQ(t, st, k, j); k++; });
    h += '</section><section class="part">' + partHead(PARTS[3]);
    t.match.forEach(function (q, m) { h += matchQ(t, st, k, m); k++; });
    h += '</section>';
    document.getElementById("paper").innerHTML = h;
    renderTabs();
    paintMap();
    paintMeta();
    paintTimer();
  }

  function paintMap() {
    var t = TESTS[cur], st = S[t.id], h = "";
    for (var k = 0; k < 40; k++) {
      var r = itemInfo(t, st, k), cls = "dot";
      if (st.done) cls += r.pts === r.max ? " ok" : (r.pts > 0 ? " part" : " no");
      else if (r.answered) cls += " answered";
      h += '<button type="button" class="' + cls + '" data-go="' + (k + 1) + '" aria-label="Go to question ' + (k + 1) + '">' + (k + 1) + '</button>';
    }
    document.getElementById("grid").innerHTML = h;
    document.getElementById("legend").innerHTML = st.done
      ? '<span><b style="background:var(--good)"></b>Correct</span><span><b style="background:var(--warn)"></b>Partly correct</span><span><b style="background:var(--bad)"></b>Incorrect or skipped</span>'
      : '<span><b style="background:var(--accent)"></b>Answered</span><span><b style="background:var(--surface-2);border:1.5px solid var(--line)"></b>Not answered</span>';
  }

  function paintMeta() {
    var t = TESTS[cur], st = S[t.id], tt = totals(t, st);
    document.getElementById("prog").style.width = (tt.answered / 40 * 100) + "%";
    document.getElementById("count").innerHTML = tt.answered + ' <span>/ 40 answered</span>';
    var btn = document.getElementById("subbtn"), tx = document.getElementById("subtext");
    tx.className = "";
    if (st.done) {
      btn.textContent = "Retake this variant"; btn.className = "btn ghost";
      tx.textContent = "Score " + tt.sum + " of 50. Review the answers above or retake the test.";
    } else if (confirming) {
      btn.textContent = "Submit anyway"; btn.className = "btn";
      tx.className = "warn"; tx.textContent = (40 - tt.answered) + " questions are not answered yet. Submit anyway?";
    } else {
      btn.textContent = "Submit test"; btn.className = "btn";
      tx.textContent = tt.answered === 40 ? "All questions answered. Submit when you are ready." : (40 - tt.answered) + " questions left.";
    }
  }

  function clock(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function paintTimer() { document.getElementById("timer").innerHTML = '<span>Time</span> ' + clock(S[TESTS[cur].id].secs); }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function startTimer() {
    var st = S[TESTS[cur].id];
    if (timerId || st.done) return;
    timerId = setInterval(function () { st.secs++; paintTimer(); }, 1000);
  }

  /* ---------- events ---------- */
  document.getElementById("paper").addEventListener("change", function (e) {
    var t = TESTS[cur], st = S[t.id];
    if (st.done) return;
    var n = e.target.name, v = parseInt(e.target.value, 10);
    if (!n) return;
    var p = n.split("-");
    if (p[0] === "s") st.s[+p[1]] = v;
    else if (p[0] === "r") st.r[+p[1]] = v;
    else if (p[0] === "m") {
      var arr = st.m[+p[1]], at = arr.indexOf(v);
      if (e.target.checked && at < 0) arr.push(v);
      if (!e.target.checked && at >= 0) arr.splice(at, 1);
    } else if (p[0] === "x") st.x[+p[1]][+p[2]] = v;
    confirming = false;
    startTimer();
    save(); paintMap(); paintMeta();
  });

  document.getElementById("grid").addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (!b) return;
    var el = document.getElementById("q-" + b.getAttribute("data-go"));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    var i = parseInt(b.getAttribute("data-tab"), 10);
    if (i === cur) return;
    stopTimer(); confirming = false; cur = i; save(); render();
    window.scrollTo({ top: 0 });
  });

  document.getElementById("subbtn").addEventListener("click", function () {
    var t = TESTS[cur], st = S[t.id];
    if (st.done) {
      S[t.id] = fresh(); confirming = false; stopTimer(); save(); render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    var tt = totals(t, st);
    if (tt.answered < 40 && !confirming) { confirming = true; paintMeta(); return; }
    stopTimer(); st.done = true; confirming = false; save(); render();
    var r = document.getElementById("result");
    if (r) { r.scrollIntoView({ behavior: "smooth", block: "start" }); r.focus({ preventScroll: true }); }
  });

  load();
  render();
  var s0 = S[TESTS[cur].id];
  if (!s0.done && totals(TESTS[cur], s0).answered > 0) startTimer();
})();
</script>

</body></html>
